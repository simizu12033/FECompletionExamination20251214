<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title7 desc7"><title id="title7">問7 再入可能プログラム</title><desc id="desc7">再入可能プログラムを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問07 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">再入可能プログラム</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="325" y="175" width="310" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="343" y="209" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">共有するプログラム</text><text x="343" y="243" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">同じ命令部分を利用</text><rect x="70" y="405" width="340" height="140" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="88" y="439" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">タスクA</text><text x="88" y="473" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">A専用の作業領域</text><rect x="550" y="405" width="340" height="140" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="568" y="439" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">タスクB</text><text x="568" y="473" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">B専用の作業領域</text><line x1="240" y1="400" x2="400" y2="280" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow7)"/><line x1="720" y1="400" x2="570" y2="280" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow7)"/><text x="175" y="600" font-size="22" fill="#16324f" font-weight="400" text-anchor="start">同時に呼ばれても、それぞれ正しい結果を返す</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">再帰＝自分を呼ぶ、再配置＝配置位置が変わる、再入＝並行利用できる。</text></g></svg>