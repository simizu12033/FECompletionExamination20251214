" fill="#087d64" font-weight="700" text-anchor="start">Q</text><text x="55" y="550" font-size="24" fill="#16324f" font-weight="400" text-anchor="start">P→R：4C2＝6通り</text><text x="500" y="550" font-size="24" fill="#16324f" font-weight="400" text-anchor="start">R→Q：5C2＝10通り</text><text x="265" y="602" font-size="26" fill="#087d64" font-weight="700" text-anchor="start">Rを通る：6 × 10 ＝ 60通り</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">前半の各経路と後半の各経路を組み合わせるため積を取る。</text></g></svg>