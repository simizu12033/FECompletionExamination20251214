<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title30 desc30"><title id="title30">問30 JVN</title><desc id="desc30">JVNを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問30 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">JVN</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="65" y="165" width="330" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="199" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">JPCERT/CC</text><rect x="565" y="165" width="330" height="105" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="583" y="199" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">IPA</text><line x1="230" y1="275" x2="390" y2="355" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow30)"/><line x1="730" y1="275" x2="570" y2="355" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow30)"/><rect x="220" y="365" width="520" height="115" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="238" y="399" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">JVN</text><text x="238" y="433" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">脆弱性情報と対策情報を提供</text><line x1="480" y1="485" x2="480" y2="545" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow30)"/><text x="190" y="595" font-size="22" fill="#16324f" font-weight="400" text-anchor="start">利用者：影響する製品・版・修正版・回避策を確認</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">JVNは情報提供ポータル。診断ツール、深刻度評価法、分類体系とは別。</text></g></svg>