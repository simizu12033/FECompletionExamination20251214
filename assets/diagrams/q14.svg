<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title14 desc14"><title id="title14">問14 テストカバレージ</title><desc id="desc14">テストカバレージを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問14 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">テストカバレージ</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><text x="65" y="170" font-size="26" fill="#2872ae" font-weight="700" text-anchor="start">命令10個のうち、実行済み8個</text><rect x="65" y="210" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="83" y="244" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令1</text><rect x="240" y="210" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="258" y="244" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令2</text><rect x="415" y="210" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="433" y="244" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令3</text><rect x="590" y="210" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="608" y="244" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令4</text><rect x="765" y="210" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="783" y="244" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令5</text><rect x="65" y="325" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="83" y="359" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令6</text><rect x="240" y="325" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="258" y="359" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令7</text><rect x="415" y="325" width="150" height="80" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="433" y="359" font-size="21" fill="#087d64" font-weight="700" text-anchor="start">命令8</text><rect x="590" y="325" width="150" height="80" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="608" y="359" font-size="21" fill="#16324f" font-weight="700" text-anchor="start">命令9</text><rect x="765" y="325" width="150" height="80" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="783" y="359" font-size="21" fill="#16324f" font-weight="700" text-anchor="start">命令10</text><text x="230" y="500" font-size="31" fill="#087d64" font-weight="700" text-anchor="start">命令網羅率 8 ÷ 10 ＝ 80％</text><text x="155" y="570" font-size="23" fill="#16324f" font-weight="400" text-anchor="start">未実行部分も見つけ、追加テストを考える</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">カバレージは実行の網羅度。100％でも欠陥ゼロの証明ではない。</text></g></svg>