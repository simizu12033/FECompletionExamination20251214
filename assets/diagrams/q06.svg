<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title6 desc6"><title id="title6">問6 クイックソート</title><desc id="desc6">クイックソートを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問06 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">クイックソート</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="270" y="155" width="420" height="82" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="288" y="189" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">[7, 2, 5, 1, 9]  ピボット＝5</text><line x1="400" y1="242" x2="230" y2="330" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow6)"/><line x1="570" y1="242" x2="730" y2="330" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow6)"/><rect x="80" y="345" width="300" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="98" y="379" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">小さい群 [2, 1]</text><text x="98" y="413" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">同じ分割処理を繰り返す</text><rect x="580" y="345" width="300" height="120" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="598" y="379" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">大きい群 [7, 9]</text><text x="598" y="413" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">同じ分割処理を繰り返す</text><line x1="230" y1="470" x2="390" y2="540" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow6)"/><line x1="730" y1="470" x2="570" y2="540" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow6)"