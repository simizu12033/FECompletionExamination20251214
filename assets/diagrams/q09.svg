<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title9 desc9"><title id="title9">問9 メモリインタリーブ</title><desc id="desc9">メモリインタリーブを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問09 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">メモリインタリーブ</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="335" y="150" width="290" height="85" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="353" y="184" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">CPUの連続アクセス</text><rect x="65" y="335" width="350" height="170" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="83" y="369" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">バンク0</text><text x="83" y="403" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">アドレス0、2、4…</text><rect x="545" y="335" width="350" height="170" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="563" y="369" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">バンク1</text><text x="563" y="403" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">アドレス1、3、5…</text><line x1="400" y1="240" x2="240" y2="330" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow9)"/><line x1="560" y1="240" x2="720" y2="330" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow9)"/><text x="90" y="575" font-size="25" fill="#16324f" font-weight="400" text-anchor="start">独立したバンクを交互に使い、待ち時間を重ねる</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">高速なコピーを置くキャッシュとは異なる、主記憶の並列アクセス。</text></g></svg>