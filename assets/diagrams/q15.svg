<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title15 desc15"><title id="title15">問15 オープンソースソフトウェア</title><desc id="desc15">オープンソースソフトウェアを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問15 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">オープンソースソフトウェア</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="55" y="165" width="260" height="78" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="67" y="211.0" font-size="21" fill="white" font-weight="700" text-anchor="start">OSSの利用条件</text><rect x="315" y="165" width="590" height="78" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="327" y="211.0" font-size="21" fill="white" font-weight="700" text-anchor="start">整理するポイント</text><rect x="55" y="243" width="260" height="78" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="67" y="289.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">ソースコード</text><rect x="315" y="243" width="590" height="78" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="327" y="289.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">公開され、条件の下で改変可能</text><rect x="55" y="321" width="260" height="78" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="367.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">著作権</text><rect x="315" y="321" width="590" height="78" rx="0" fill="white" stroke="#bfd0df"/><text x="327" y="367.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">通常は保持されたまま</text><rect x="55" y="399" width="260" height="78" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="445.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">再配布</text><rect x="315" y="399" width="590" height="78" rx="0" fill="white" stroke="#bfd0df"/><text x="327" y="445.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">ライセンス条件に従う</text><rect x="55" y="477" width="260" height="78" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="523.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">価格</text><rect x="315" y="477" width="590" height="78" rx="0" fill="white" stroke="#bfd0df"/><text x="327" y="523.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">有償の配布も可能</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">「公開」「改変可能」「無条件」「無償」「著作権放棄」を同一視しない。</text></g></svg>