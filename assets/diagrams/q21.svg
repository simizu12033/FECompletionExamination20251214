<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title21 desc21"><title id="title21">問21 DBMSのクエリ処理</title><desc id="desc21">DBMSのクエリ処理を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問21 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">DBMSのクエリ処理</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="205" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="239" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">① 構文解析</text><text x="68.0" y="273" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">SQLの文法と構造を確認</text><line x1="322.6666666666667" y1="285" x2="340.6666666666667" y2="285" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow21)"/><rect x="344.6666666666667" y="205" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="362.6666666666667" y="239" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">② 最適化</text><text x="362.6666666666667" y="273" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">効率のよい実行計画を選択</text><line x1="617.3333333333334" y1="285" x2="635.3333333333334" y2="285" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow21)"/><rect x="639.3333333333334" y="205" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="657.3333333333334" y="239" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">③ コード生成</text><text x="657.3333333333334" y="273" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">計画を実行可能な形へ</text><rect x="130" y="455" width="700" height="120" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="148" y="489" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">その後に実行</text><text x="148" y="523" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">クエリ → 解析 → 最適化 → 生成 → 実行</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">解析する前にコードを作らず、実行方法を最適化してから生成する。</text></g></svg>