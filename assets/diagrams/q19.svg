<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title19 desc19"><title id="title19">問19 データ項目の命名規約</title><desc id="desc19">データ項目の命名規約を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問19 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">データ項目の命名規約</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="60" y="170" width="390" height="235" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="78" y="204" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">命名規約で統一</text><text x="78" y="238" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">末尾の区分語 → データ型／辞書 →</text><text x="78" y="265" font-size="18" fill="#16324f" font-weight="400" text-anchor="start"> 意味と名称の対応</text><rect x="510" y="170" width="390" height="235" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="528" y="204" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">別に必要な定義</text><text x="528" y="238" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">値の範囲・上限・下限などのドメインや</text><text x="528" y="265" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">CHECK制約</text><rect x="55" y="440" width="340" height="49" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="67" y="471.5" font-size="21" fill="white" font-weight="700" text-anchor="start">同名の受注金額</text><rect x="395" y="440" width="510" height="49" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="407" y="471.5" font-size="21" fill="white" font-weight="700" text-anchor="start">許容範囲の例</text><rect x="55" y="489" width="340" height="49" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="520.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">表A</text><rect x="395" y="489" width="510" height="49" rx="0" fill="white" stroke="#bfd0df"/><text x="407" y="520.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">0〜100万円</text><rect x="55" y="538" width="340" height="49" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="569.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">表B</text><rect x="395" y="538" width="510" height="49" rx="0" fill="white" stroke="#bfd0df"/><text x="407" y="569.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">0〜1000万円</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">名称と型が同じでも値域は決まらない。選択肢イは規約だけでは防げない。</text></g></svg>