<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title20 desc20"><title id="title20">問20 SQLカーソル</title><desc id="desc20">SQLカーソルを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問20 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">SQLカーソル</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="60" y="170" width="175.0" height="75" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="72" y="214.5" font-size="21" fill="white" font-weight="700" text-anchor="start">結果集合</text><rect x="235.0" y="170" width="175.0" height="75" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="247.0" y="214.5" font-size="21" fill="white" font-weight="700" text-anchor="start">金額</text><rect x="60" y="245" width="175.0" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="72" y="289.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">行1</text><rect x="235.0" y="245" width="175.0" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="247.0" y="289.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1000</text><rect x="60" y="320" width="175.0" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="72" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">行2</text><rect x="235.0" y="320" width="175.0" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="247.0" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">2500</text><rect x="60" y="395" width="175.0" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="72" y="439.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">行3</text><rect x="235.0" y="395" width="175.0" height="75" rx="0" fill="white" stroke="#bfd0df"/><text x="247.0" y="439.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1800</text><rect x="570" y="220" width="325" height="180" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="588" y="254" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">親プログラム</text><text x="588" y="288" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">FETCHで1行受取り／その行</text><text x="588" y="315" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">を処理／次の行を取得</text><line x1="420" y1="315" x2="560" y2="315" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow20)"/><text x="430" y="285" font-size="21" fill="#2872ae" font-weight="700" text-anchor="start">FETCH</text><text x="100" y="560" font-size="28" fill="#16324f" font-weight="400" text-anchor="start">OPEN → FETCHを繰り返す → CLOSE</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">カーソルは結果集合を1行ずつ扱う。ORDER BYは並べ替え。</text></g></svg>