<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title22 desc22"><title id="title22">問22 共有ロックと専有ロック</title><desc id="desc22">共有ロックと専有ロックを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問22 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">共有ロックと専有ロック</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="55" y="200" width="350" height="105" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="67" y="259.5" font-size="21" fill="white" font-weight="700" text-anchor="start">既存ロック＼新規</text><rect x="405" y="200" width="250" height="105" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="417" y="259.5" font-size="21" fill="white" font-weight="700" text-anchor="start">共有</text><rect x="655" y="200" width="250" height="105" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="667" y="259.5" font-size="21" fill="white" font-weight="700" text-anchor="start">専有</text><rect x="55" y="305" width="350" height="105" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="67" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">共有</text><rect x="405" y="305" width="250" height="105" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="417" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">取得可</text><rect x="655" y="305" width="250" height="105" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="667" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">取得不可</text><rect x="55" y="410" width="350" height="105" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="469.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">専有</text><rect x="405" y="410" width="250" height="105" rx="0" fill="white" stroke="#bfd0df"/><text x="417" y="469.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">取得不可</text><rect x="655" y="410" width="250" height="105" rx="0" fill="white" stroke="#bfd0df"/><text x="667" y="469.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">取得不可</text><text x="150" y="590" font-size="25" fill="#16324f" font-weight="400" text-anchor="start">読取り同士は両立 ／ 更新は他者から排他</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">別のトランザクション間で、共有ロック同士だけが両立する。</text></g></svg>