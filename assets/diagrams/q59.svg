<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title59 desc59"><title id="title59">問59 目標利益と客席回転数</title><desc id="desc59">目標利益と客席回転数を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow59" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問59 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">目標利益と客席回転数</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="55" y="165" width="290" height="77" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="67" y="210.5" font-size="21" fill="white" font-weight="700" text-anchor="start">段階</text><rect x="345" y="165" width="370" height="77" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="357" y="210.5" font-size="21" fill="white" font-weight="700" text-anchor="start">計算</text><rect x="715" y="165" width="190" height="77" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="727" y="210.5" font-size="21" fill="white" font-weight="700" text-anchor="start">結果</text><rect x="55" y="242" width="290" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="287.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1人当たり限界利益</text><rect x="345" y="242" width="370" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="357" y="287.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">500－100</text><rect x="715" y="242" width="190" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="727" y="287.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">400円</text><rect x="55" y="319" width="290" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">月の必要客数</text><rect x="345" y="319" width="370" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="357" y="364.5" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">(300000＋100000)÷400</text><rect x="715" y="319" width="190" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="727" y="364.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1000人</text><rect x="55" y="396" width="290" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="441.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1日の必要客数</text><rect x="345" y="396" width="370" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="357" y="441.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1000÷20</text><rect x="715" y="396" width="190" height="77" rx="0" fill="white" stroke="#bfd0df"/><text x="727" y="441.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">50人</text><rect x="55" y="473" width="290" height="77" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="67" y="518.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1席1日当たり</text><rect x="345" y="473" width="370" height="77" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="357" y="518.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">50÷10</text><rect x="715" y="473" width="190" height="77" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="727" y="518.5" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">5人</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">売上ではなく限界利益で固定費と目標利益を賄う。営業日と席数で割る。</text></g></svg>