<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title36 desc36"><title id="title36">問36 状態遷移図</title><desc id="desc36">状態遷移図を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問36 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">状態遷移図</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="65" y="270" width="310" height="155" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="304" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">停止中</text><text x="83" y="338" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">ヒータを止める</text><rect x="585" y="270" width="310" height="155" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="603" y="304" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">暖房中</text><text x="603" y="338" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">ヒータを動かす</text><line x1="380" y1="300" x2="575" y2="300" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow36)"/><text x="390" y="265" font-size="21" fill="#2872ae" font-weight="700" text-anchor="start">温度＜18℃</text><line x1="580" y1="395" x2="385" y2="395" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow36)"/><text x="390" y="445" font-size="21" fill="#2872ae" font-weight="700" text-anchor="start">温度≧22℃</text><text x="150" y="565" font-size="25" fill="#16324f" font-weight="400" text-anchor="start">現在の状態 ＋ 入力条件 → 次の状態と動作</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">温度値は説明用の例。元問題はセンサ情報で制御する温室を選ぶ。</text></g></svg>