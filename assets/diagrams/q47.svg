<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title47 desc47"><title id="title47">問47 非構造化データの構造化</title><desc id="desc47">非構造化データの構造化を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow47" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問47 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">非構造化データの構造化</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="100" y="155" width="760" height="90" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="118" y="189" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">口コミ：軽いが、電池の持ちが短い</text><line x1="480" y1="250" x2="480" y2="315" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow47)"/><text x="505" y="295" font-size="21" fill="#2872ae" font-weight="700" text-anchor="start">分解・分類</text><rect x="100" y="335" width="200" height="80" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="112" y="382.0" font-size="21" fill="white" font-weight="700" text-anchor="start">対象の項目</text><rect x="300" y="335" width="160" height="80" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="312" y="382.0" font-size="21" fill="white" font-weight="700" text-anchor="start">評価</text><rect x="460" y="335" width="400" height="80" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="472" y="382.0" font-size="21" fill="white" font-weight="700" text-anchor="start">集計可能な構造</text><rect x="100" y="415" width="200" height="80" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="112" y="462.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">軽さ</text><rect x="300" y="415" width="160" height="80" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="312" y="462.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">肯定</text><rect x="460" y="415" width="400" height="80" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="472" y="462.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">軽さの肯定件数＋1</text><rect x="100" y="495" width="200" height="80" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="112" y="542.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">電池持ち</text><rect x="300" y="495" width="160" height="80" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="312" y="542.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">否定</text><rect x="460" y="495" width="400" height="80" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="472" y="542.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">電池持ちの否定件数＋1</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">自由文から項目・評価を取り出す。匿名化や表記統一とは目的が異なる。</text></g></svg>