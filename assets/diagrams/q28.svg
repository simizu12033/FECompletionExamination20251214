<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title28 desc28"><title id="title28">問28 ハッシュによるマルウェア検知</title><desc id="desc28">ハッシュによるマルウェア検知を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問28 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">ハッシュによるマルウェア検知</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="55" y="165" width="350" height="92" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="67" y="218.0" font-size="21" fill="white" font-weight="700" text-anchor="start">ファイル内容（説明用）</text><rect x="405" y="165" width="290" height="92" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="417" y="218.0" font-size="21" fill="white" font-weight="700" text-anchor="start">SHA-256の先頭12桁</text><rect x="695" y="165" width="210" height="92" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="707" y="218.0" font-size="21" fill="white" font-weight="700" text-anchor="start">照合</text><rect x="55" y="257" width="350" height="92" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="310.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">検体：worm-X</text><rect x="405" y="257" width="290" height="92" rx="0" fill="white" stroke="#bfd0df"/><text x="417" y="310.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1dbce694adb7</text><rect x="695" y="257" width="210" height="92" rx="0" fill="white" stroke="#bfd0df"/><text x="707" y="310.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">登録済み</text><rect x="55" y="349" width="350" height="92" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="67" y="402.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">コピー：worm-X</text><rect x="405" y="349" width="290" height="92" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="417" y="402.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1dbce694adb7</text><rect x="695" y="349" width="210" height="92" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="707" y="402.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">一致</text><rect x="55" y="441" width="350" height="92" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="494.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">変更版：worm-Y</text><rect x="405" y="441" width="290" height="92" rx="0" fill="white" stroke="#bfd0df"/><text x="417" y="494.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">c8ab025903c7</text><rect x="695" y="441" width="210" height="92" rx="0" fill="white" stroke="#bfd0df"/><text x="707" y="494.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">不一致</text><text x="95" y="585" font-size="22" fill="#16324f" font-weight="400" text-anchor="start">一部コード・サイズが同じだけでは、全体の一致にならない</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">この図のハッシュは説明用の文字列から計算した値。実際の検体ではない。</text></g></svg>