<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title46 desc46"><title id="title46">問46 ITアウトソーシングの活用工程</title><desc id="desc46">ITアウトソーシングの活用工程を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問46 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">ITアウトソーシングの活用工程</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="230" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="264" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">計画工程</text><text x="68.0" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">方針・RFP・委託先決定</text><line x1="322.6666666666667" y1="310" x2="340.6666666666667" y2="310" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow46)"/><rect x="344.6666666666667" y="230" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="362.6666666666667" y="264" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">準備工程</text><text x="362.6666666666667" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">移行計画・テスト</text><line x1="617.3333333333334" y1="310" x2="635.3333333333334" y2="310" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow46)"/><rect x="639.3333333333334" y="230" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="657.3333333333334" y="264" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">活用工程</text><text x="657.3333333333334" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">実績評価・改善策の協議</text><text x="125" y="495" font-size="25" fill="#16324f" font-weight="400" text-anchor="start">委託先決定まで → 利用開始まで → サービス利用後</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">選択肢ウは、利用後の実績と評価を基に改善を進める活用工程。</text></g></svg>