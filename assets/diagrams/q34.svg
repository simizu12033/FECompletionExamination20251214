<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title34 desc34"><title id="title34">問34 E-R図</title><desc id="desc34">E-R図を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow34" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問34 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">E-R図</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="75" y="240" width="310" height="170" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="93" y="274" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">実体：顧客</text><text x="93" y="308" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">顧客番号／氏名</text><rect x="575" y="240" width="310" height="170" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="593" y="274" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">実体：注文</text><text x="593" y="308" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">注文番号／顧客番号</text><line x1="385" y1="325" x2="575" y2="325" stroke="#2872ae" stroke-width="2"/><text x="405" y="305" font-size="25" fill="#087d64" font-weight="700" text-anchor="start">1</text><text x="540" y="305" font-size="25" fill="#087d64" font-weight="700" text-anchor="start">N</text><text x="420" y="365" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">注文する</text><text x="160" y="530" font-size="26" fill="#16324f" font-weight="400" text-anchor="start">顧客1人に、複数の注文が対応する（1対多）</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">E-R図はデータの対象と結び付きを表す。処理順序やデータの流れではない。</text></g></svg>