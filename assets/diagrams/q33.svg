<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title33 desc33"><title id="title33">問33 重要操作の前の再認証</title><desc id="desc33">重要操作の前の再認証を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問33 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">重要操作の前の再認証</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="225" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="259" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">盗んだID</text><text x="68.0" y="293" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">セッションとしては有効</text><line x1="322.6666666666667" y1="305" x2="340.6666666666667" y2="305" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow33)"/><rect x="344.6666666666667" y="225" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="362.6666666666667" y="259" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">再認証</text><text x="362.6666666666667" y="293" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">パスワードを改めて確認</text><line x1="617.3333333333334" y1="305" x2="635.3333333333334" y2="305" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow33)"/><rect x="639.3333333333334" y="225" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="657.3333333333334" y="259" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">重要情報</text><text x="657.3333333333334" y="293" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">確認後にだけ表示する</text><text x="330" y="455" font-size="26" fill="#087d64" font-weight="700" text-anchor="start">セッションIDだけでは通れない</text><rect x="100" y="505" width="760" height="95" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="118" y="539" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">目的：乗っ取り後の被害を抑える</text><text x="118" y="573" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">通信暗号化やcookieの安全な管理も別途必要</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">重要な処理の直前に、利用者が本人であることを追加確認する。</text></g></svg>