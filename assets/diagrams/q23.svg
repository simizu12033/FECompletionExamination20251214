<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title23 desc23"><title id="title23">問23 IPv4の表記</title><desc id="desc23">IPv4の表記を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問23 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">IPv4の表記</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="65" y="220" width="175" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="254" font-size="34" fill="#16324f" font-weight="700" text-anchor="start">10</text><text x="83" y="288" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">8ビット</text><text x="250" y="290" font-size="36" fill="#16324f" font-weight="400" text-anchor="start">.</text><rect x="285" y="220" width="175" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="303" y="254" font-size="34" fill="#16324f" font-weight="700" text-anchor="start">10</text><text x="303" y="288" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">8ビット</text><text x="470" y="290" font-size="36" fill="#16324f" font-weight="400" text-anchor="start">.</text><rect x="505" y="220" width="175" height="140" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="523" y="254" font-size="34" fill="#16324f" font-weight="700" text-anchor="start">10</text><text x="523" y="288" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">8ビット</text><text x="690" y="290" font-size="36" fill="#16324f" font-weight="400" text-anchor="start">.</text><rect x="725" y="220" width="175" height="140" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="743" y="254" font-size="34" fill="#16324f" font-weight="700" text-anchor="start">256</text><text x="743" y="288" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">8ビット</text><rect x="100" y="445" width="760" height="130" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="118" y="479" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">8ビットで表せる範囲：0〜255</text><text x="118" y="513" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">256は上限を超えるため、IPv4表記として不正</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">アドレスの用途・割当て可否より前に、各組の値の範囲を確認する。</text></g></svg>