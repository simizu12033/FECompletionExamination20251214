<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title29 desc29"><title id="title29">問29 ディジタル署名</title><desc id="desc29">ディジタル署名を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問29 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">ディジタル署名</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="210" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="244" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">送信者A</text><text x="68.0" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">Aの秘密鍵で署名を作成</text><line x1="322.6666666666667" y1="290" x2="340.6666666666667" y2="290" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow29)"/><rect x="344.6666666666667" y="210" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="362.6666666666667" y="244" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">文書＋署名</text><text x="362.6666666666667" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">通信で受信者へ送る</text><line x1="617.3333333333334" y1="290" x2="635.3333333333334" y2="290" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow29)"/><rect x="639.3333333333334" y="210" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="657.3333333333334" y="244" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">受信者B</text><text x="657.3333333333334" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">Aの公開鍵で署名を検証</text><rect x="95" y="450" width="770" height="145" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="113" y="484" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">検証で確認すること</text><text x="113" y="518" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">送信者の確認／署名後の改ざんの有無。内容の秘匿には別途暗号化。</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">署名鍵と検証鍵は対応する鍵対。受信者自身の署名鍵で検証するのではない。</text></g></svg>