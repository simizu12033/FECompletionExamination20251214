<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="t45"><title id="t45">問45 監査サンプリングの要点整理</title><rect width="960" height="650" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="40" y="40" font-size="18">問45 ／ 2025.12.14 FE修了試験</text><text x="40" y="90" font-size="28" font-weight="bold">監査サンプリング</text><rect x="40" y="125" width="880" height="165" rx="12" fill="#e8f1fa"/><text x="65" y="157" font-size="18" fill="#2872ae">STEP 1</text><text x="65" y="192" font-size="21">許容逸脱率は、監査人が受け入れられる内部統制の逸脱率で、サンプル件数の決定に</text><text x="65" y="221" font-size="21">使う。</text><path d="M480 297v17m-8-8 8 8 8-8" fill="none" stroke="#2872ae" stroke-width="3"/><rect x="40" y="320" width="880" height="165" rx="12" fill="#e4f5ed"/><text x="65" y="352" font-size="18" fill="#2872ae">STEP 2</text><text x="65" y="387" font-size="21">母集団の一部から全体を判断する際は、結論が全数検査と異なるサンプリングリスク</text><text x="65" y="416" font-size="21">がある。</text><rect x="40" y="545" width="880" height="65" rx="12" fill="#16324f"/><text x="65" y="586" font-size="22" fill="white">正答 ア ／ 判断の流れを自分の言葉で確認しよう</text></g></svg>