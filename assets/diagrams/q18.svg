<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title18 desc18"><title id="title18">問18 主キー制約</title><desc id="desc18">主キー制約を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問18 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">主キー制約</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="55" y="165" width="300" height="76" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="67" y="210.0" font-size="21" fill="white" font-weight="700" text-anchor="start">学籍番号（主キー）</text><rect x="355" y="165" width="170" height="76" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="367" y="210.0" font-size="21" fill="white" font-weight="700" text-anchor="start">氏名</text><rect x="525" y="165" width="380" height="76" rx="0" fill="#16324f" stroke="#bfd0df"/><text x="537" y="210.0" font-size="21" fill="white" font-weight="700" text-anchor="start">登録</text><rect x="55" y="241" width="300" height="76" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="67" y="286.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1001</text><rect x="355" y="241" width="170" height="76" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="367" y="286.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">青木</text><rect x="525" y="241" width="380" height="76" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="537" y="286.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">可</text><rect x="55" y="317" width="300" height="76" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="67" y="362.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1002</text><rect x="355" y="317" width="170" height="76" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="367" y="362.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">井上</text><rect x="525" y="317" width="380" height="76" rx="0" fill="#e4f5ed" stroke="#bfd0df"/><text x="537" y="362.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">可</text><rect x="55" y="393" width="300" height="76" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="438.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">1001</text><rect x="355" y="393" width="170" height="76" rx="0" fill="white" stroke="#bfd0df"/><text x="367" y="438.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">上田</text><rect x="525" y="393" width="380" height="76" rx="0" fill="white" stroke="#bfd0df"/><text x="537" y="438.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">不可：番号が重複</text><rect x="55" y="469" width="300" height="76" rx="0" fill="white" stroke="#bfd0df"/><text x="67" y="514.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">NULL</text><rect x="355" y="469" width="170" height="76" rx="0" fill="white" stroke="#bfd0df"/><text x="367" y="514.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">遠藤</text><rect x="525" y="469" width="380" height="76" rx="0" fill="white" stroke="#bfd0df"/><text x="537" y="514.0" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">不可：キーが未定</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">重複不可 ＋ NULL不可。複数列を組み合わせる複合主キーも可能。</text></g></svg>