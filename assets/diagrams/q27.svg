<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title27 desc27"><title id="title27">問27 格納型XSS</title><desc id="desc27">格納型XSSを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問27 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">格納型XSS</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="225" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="259" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">攻撃者</text><text x="68.0" y="293" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">投稿へスクリプトを混入</text><line x1="322.6666666666667" y1="305" x2="340.6666666666667" y2="305" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow27)"/><rect x="344.6666666666667" y="225" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="362.6666666666667" y="259" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">掲示板DB</text><text x="362.6666666666667" y="293" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">不正な投稿が保存される</text><line x1="617.3333333333334" y1="305" x2="635.3333333333334" y2="305" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow27)"/><rect x="639.3333333333334" y="225" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="657.3333333333334" y="259" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">閲覧者</text><text x="657.3333333333334" y="293" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">配信された投稿で実行</text><rect x="140" y="465" width="680" height="110" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="158" y="499" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">保存され、後の閲覧者へ届く</text><text x="158" y="533" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">利用者AにもBにも同じ不正な投稿が配信され得る</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">格納型XSS：保存場所はWeb側、スクリプトの実行場所は利用者側。</text></g></svg>