<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title31 desc31"><title id="title31">問31 SIEM</title><desc id="desc31">SIEMを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow31" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問31 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">SIEM</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="40" y="160" width="270" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="58" y="194" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">認証ログ</text><text x="58" y="228" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">失敗→成功</text><rect x="345" y="160" width="270" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="363" y="194" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">FWログ</text><text x="363" y="228" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">通信の記録</text><rect x="650" y="160" width="270" height="115" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="668" y="194" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">サーバログ</text><text x="668" y="228" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">処理の記録</text><line x1="170" y1="280" x2="480" y2="365" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow31)"/><line x1="480" y1="280" x2="480" y2="365" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow31)"/><line x1="785" y1="280" x2="480" y2="365" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow31)"/><rect x="230" y="375" width="500" height="130" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="248" y="409" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">SIEMで集約・相関分析</text><text x="248" y="443" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">時刻・利用者・送信元などを関連付ける</text><text x="190" y="585" font-size="23" fill="#16324f" font-weight="400" text-anchor="start">異常の兆候を検知 → 管理者の調査・対応を支援</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">複数機器のログをまとめることで、個別ログだけでは見えない関連を探す。</text></g></svg>