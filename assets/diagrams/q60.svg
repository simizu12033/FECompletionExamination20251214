<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title60 desc60"><title id="title60">問60 請負契約の指揮命令</title><desc id="desc60">請負契約の指揮命令を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問60 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">請負契約の指揮命令</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="60" y="180" width="360" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="78" y="214" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">発注者</text><text x="78" y="248" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">仕事の完成を依頼</text><rect x="540" y="180" width="360" height="130" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="558" y="214" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">受注者（請負会社）</text><text x="558" y="248" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">労働者の雇用元</text><line x1="425" y1="245" x2="530" y2="245" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow60)"/><rect x="540" y="465" width="360" height="130" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="558" y="499" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">労働者</text><text x="558" y="533" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">発注者の事業所で働く場合もある</text><line x1="720" y1="315" x2="720" y2="455" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow60)"/><rect x="525" y="361" width="310" height="43" rx="4" fill="#f8fbfe" stroke="none"/><text x="540" y="390" font-size="23" fill="#087d64" font-weight="700" text-anchor="start">受注者から指揮命令</text><text x="70" y="525" font-size="24" fill="#2872ae" font-weight="700" text-anchor="start">場所と指揮命令を区別</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">設問の請負では受注者が指揮命令。派遣は派遣先が指揮命令する。</text></g></svg>