<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title54 desc54"><title id="title54">問54 MRP</title><desc id="desc54">MRPを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問54 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">MRP</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="190" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="224" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">生産計画</text><text x="68.0" y="258" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">製品10個を作る</text><line x1="322.6666666666667" y1="270" x2="340.6666666666667" y2="270" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow54)"/><rect x="344.6666666666667" y="190" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="362.6666666666667" y="224" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">部品表</text><text x="362.6666666666667" y="258" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">1製品に部品2個必要</text><line x1="617.3333333333334" y1="270" x2="635.3333333333334" y2="270" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow54)"/><rect x="639.3333333333334" y="190" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="657.3333333333334" y="224" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">在庫確認</text><text x="657.3333333333334" y="258" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">使用できる在庫5個</text><rect x="100" y="440" width="760" height="135" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="118" y="474" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">正味所要量＝10×2－5＝15個</text><text x="118" y="508" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">必要な生産日に間に合うよう、調達リードタイムから発注日も逆算</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">数量は説明用。MRPは必要な資材の量と時期を計画する。</text></g></svg>