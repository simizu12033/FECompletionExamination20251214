<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title40 desc40"><title id="title40">問40 ペアプログラミング</title><desc id="desc40">ペアプログラミングを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問40 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">ペアプログラミング</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="70" y="180" width="320" height="135" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="88" y="214" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">プログラマA</text><text x="88" y="248" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">入力する：ドライバ</text><rect x="570" y="180" width="320" height="135" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="588" y="214" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">プログラマB</text><text x="588" y="248" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">確認する：ナビゲータ</text><line x1="240" y1="320" x2="410" y2="440" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow40)"/><line x1="730" y1="320" x2="550" y2="440" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow40)"/><rect x="200" y="450" width="560" height="120" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="218" y="484" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">一つのプログラム</text><text x="218" y="518" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">その場で相談し、役割を交代して開発</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">別々のコードへの分業や、交互に休まず働く方法ではない。</text></g></svg>