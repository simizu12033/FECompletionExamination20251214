<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="t43"><title id="t43">問43 ミッションクリティカルの要点整理</title><rect width="960" height="650" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="40" y="40" font-size="18">問43 ／ 2025.12.14 FE修了試験</text><text x="40" y="90" font-size="28" font-weight="bold">ミッションクリティカル</text><rect x="40" y="125" width="880" height="165" rx="12" fill="#e8f1fa"/><text x="65" y="157" font-size="18" fill="#2872ae">STEP 1</text><text x="65" y="192" font-size="21">障害や停止が企業活動や社会に重大な影響を及ぼす、極めて重要なシステムを指す。</text><path d="M480 297v17m-8-8 8 8 8-8" fill="none" stroke="#2872ae" stroke-width="3"/><rect x="40" y="320" width="880" height="165" rx="12" fill="#e4f5ed"/><text x="65" y="352" font-size="18" fill="#2872ae">STEP 2</text><text x="65" y="387" font-size="21">例えば基幹決済や重要な社会インフラを支えるシステムでは高い可用性が求められる</text><text x="65" y="416" font-size="21">。</text><rect x="40" y="545" width="880" height="65" rx="12" fill="#16324f"/><text x="65" y="586" font-size="22" fill="white">正答 ウ ／ 判断の流れを自分の言葉で確認しよう</text></g></svg>