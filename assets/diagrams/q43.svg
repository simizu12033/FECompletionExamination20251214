<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title43 desc43"><title id="title43">問43 ミッションクリティカル</title><desc id="desc43">ミッションクリティカルを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow43" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問43 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">ミッションクリティカル</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="235" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="269" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">システム停止</text><text x="68.0" y="303" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">決済・重要インフラなど</text><line x1="322.6666666666667" y1="315" x2="340.6666666666667" y2="315" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow43)"/><rect x="344.6666666666667" y="235" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="362.6666666666667" y="269" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">業務の停止</text><text x="362.6666666666667" y="303" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">代替しにくい重要な処理</text><line x1="617.3333333333334" y1="315" x2="635.3333333333334" y2="315" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow43)"/><rect x="639.3333333333334" y="235" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="657.3333333333334" y="269" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">重大な影響</text><text x="657.3333333333334" y="303" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">企業活動や社会へ波及</text><rect x="120" y="470" width="720" height="110" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="138" y="504" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">ミッションクリティカル</text><text x="138" y="538" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">停止時の影響が重大 → 可用性や復旧性を重視</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">性能限界で稼働するという意味ではなく、業務や社会に対する重要性。</text></g></svg>