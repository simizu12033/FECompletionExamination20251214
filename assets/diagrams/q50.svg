<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title50 desc50"><title id="title50">問50 価格と需要の一次関係</title><desc id="desc50">価格と需要の一次関係を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問50 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">価格と需要の一次関係</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><line x1="150" y1="550" x2="825" y2="550" stroke="#16324f" stroke-width="2"/><line x1="150" y1="550" x2="150" y2="200" stroke="#16324f" stroke-width="2"/><circle cx="150.0" cy="220.0" r="7" fill="#087d64"/><text x="130.0" y="585" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">1000</text><text x="158.0" y="205.0" font-size="20" fill="#087d64" font-weight="400" text-anchor="start">60,000</text><circle cx="312.5" cy="302.5" r="7" fill="#087d64"/><text x="292.5" y="585" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">1500</text><text x="320.5" y="287.5" font-size="20" fill="#087d64" font-weight="400" text-anchor="start">45,000</text><circle cx="475.0" cy="385.0" r="7" fill="#087d64"/><text x="455.0" y="585" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">2000</text><text x="483.0" y="370.0" font-size="20" fill="#087d64" font-weight="400" text-anchor="start">30,000</text><circle cx="800.0" cy="550.0" r="7" fill="#087d64"/><text x="780.0" y="585" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">3000</text><text x="808.0" y="535.0" font-size="20" fill="#087d64" font-weight="400" text-anchor="start">0</text><line x1="