<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title24 desc24"><title id="title24">問24 OSIネットワーク層</title><desc id="desc24">OSIネットワーク層を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問24 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">OSIネットワーク層</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="65" y="150" width="365" height="55" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="184" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">7 アプリケーション</text><rect x="65" y="212" width="365" height="55" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="246" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">6 プレゼンテーション</text><rect x="65" y="274" width="365" height="55" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="308" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">5 セッション</text><rect x="65" y="336" width="365" height="55" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="370" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">4 トランスポート</text><rect x="65" y="398" width="365" height="55" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="83" y="432" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">3 ネットワーク</text><rect x="65" y="460" width="365" height="55" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="494" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">2 データリンク</text><rect x="65" y="522" width="365" height="55" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="83" y="556" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">1 物理</text><rect x="510" y="210" width="380" height="240" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="528" y="244" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">第3層：経路選択</text><text x="528" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">異なるネットワークをまたいでパケット</text><text x="528" y="305" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">を中継／IP・ルータ</text><line x1="435" y1="425" x2="500" y2="330" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow24)"/><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">隣接ノード間のフレーム転送は第2層。利用者機能は第7層。</text></g></svg>