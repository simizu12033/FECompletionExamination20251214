<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title56 desc56"><title id="title56">問56 BCP</title><desc id="desc56">BCPを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問56 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">BCP</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="235" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="269" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">平常時</text><text x="68.0" y="303" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">優先業務・代替手段を計画</text><line x1="322.6666666666667" y1="315" x2="340.6666666666667" y2="315" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow56)"/><rect x="344.6666666666667" y="235" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="362.6666666666667" y="269" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">災害・障害</text><text x="362.6666666666667" y="303" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">安全確保・連絡・切替え</text><line x1="617.3333333333334" y1="315" x2="635.3333333333334" y2="315" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow56)"/><rect x="639.3333333333334" y="235" width="270.6666666666667" height="160" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="657.3333333333334" y="269" font-size="20" fill="#087d64" font-weight="700" text-anchor="start">継続と復旧</text><text x="657.3333333333334" y="303" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">重要業務を再開し維持</text><rect x="115" y="475" width="730" height="115" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="133" y="509" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">BCP：事業継続計画</text><text x="133" y="543" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">人員・拠点・システム等を含め、事業の継続を準備</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">組織のリスク全般を統合管理するERMより、継続・復旧へ焦点を当てる。</text></g></svg>