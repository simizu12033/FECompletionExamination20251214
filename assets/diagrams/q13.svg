<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title13 desc13"><title id="title13">問13 スラッシング</title><desc id="desc13">スラッシングを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問13 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">スラッシング</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="60" y="170" width="350" height="170" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="78" y="204" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">主記憶：3ページ分</text><text x="78" y="238" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">A ／ B ／ C</text><rect x="550" y="170" width="350" height="170" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="568" y="204" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">補助記憶</text><text x="568" y="238" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">D ／ E ／ F …</text><line x1="415" y1="225" x2="540" y2="225" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow13)"/><text x="430" y="207" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">退避</text><line x1="540" y1="295" x2="415" y2="295" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow13)"/><text x="430" y="325" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">読込み</text><rect x="100" y="425" width="760" height="140" rx="12" fill="#fff1c9" stroke="#bfd0df"/><text x="118" y="459" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">ページ交換が頻発</text><text x="118" y="493" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">必要ページが収まらない → 交換待ちが増える → 実処理が進まない</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">処理の多重度を上げ過ぎ、ページ交換が支配的になるのがスラッシング。</text></g></svg>