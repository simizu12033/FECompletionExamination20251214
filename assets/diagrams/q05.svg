<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title5 desc5"><title id="title5">問5 連結リスト</title><desc id="desc5">連結リストを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問05 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">連結リスト</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><text x="55" y="164" font-size="23" fill="#2872ae" font-weight="700" text-anchor="start">挿入前</text><rect x="100" y="200" width="180" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="118" y="234" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">A</text><rect x="620" y="200" width="180" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="638" y="234" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">C</text><line x1="285" y1="250" x2="610" y2="250" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow5)"/><text x="55" y="374" font-size="23" fill="#2872ae" font-weight="700" text-anchor="start">Bを挿入後</text><rect x="100" y="410" width="180" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="118" y="444" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">A</text><rect x="360" y="410" width="180" height="100" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="378" y="444" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">B</text><rect x="620" y="410" width="180" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="638" y="444" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">C</text><line x1="285" y1="460" x2="350" y2="460" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow5)"/><line x1="545" y1="460" x2="610" y2="460" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow5)"/><text x="180" y="580" font-size="24" fill="#16324f" font-weight="400" text-anchor="start">要素全体を移動せず、参照をつなぎ替える</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">位置の探索と、位置が分かった後のポインタ更新を区別する。</text></g></svg>