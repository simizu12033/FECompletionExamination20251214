<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title35 desc35"><title id="title35">問35 継承と基底・派生クラス</title><desc id="desc35">継承と基底・派生クラスを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問35 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">継承と基底・派生クラス</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="315" y="170" width="330" height="100" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="333" y="204" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">基底クラス：図形</text><rect x="315" y="440" width="330" height="100" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="333" y="474" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">派生クラス：三角形</text><line x1="480" y1="435" x2="480" y2="280" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow35)"/><text x="525" y="355" font-size="27" fill="#087d64" font-weight="700" text-anchor="start">is-a</text><text x="120" y="605" font-size="23" fill="#16324f" font-weight="400" text-anchor="start">三角形は図形の一種 ／ エンジンは自動車の部品</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">継承は「一種である」。全体と部分のhas-a関係とは異なる。</text></g></svg>