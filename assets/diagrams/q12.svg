<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title12 desc12"><title id="title12">問12 MTBF・MTTR</title><desc id="desc12">MTBF・MTTRを問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問12 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">MTBF・MTTR</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="210" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="244" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">正常稼働</text><text x="68.0" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">長くなると故障しにくい</text><line x1="322.6666666666667" y1="290" x2="340.6666666666667" y2="290" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow12)"/><rect x="344.6666666666667" y="210" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="362.6666666666667" y="244" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">故障・修理</text><text x="362.6666666666667" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">短いほど早く復旧</text><line x1="617.3333333333334" y1="290" x2="635.3333333333334" y2="290" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow12)"/><rect x="639.3333333333334" y="210" width="270.6666666666667" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="657.3333333333334" y="244" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">正常稼働</text><text x="657.3333333333334" y="278" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">次の故障まで稼働</text><text x="100" y="425" font-size="26" fill="#087d64" font-weight="700" text-anchor="start">MTBF：平均故障間隔</text><text x="510" y="425" font-size="26" fill="#2872ae" font-weight="700" text-anchor="start">MTTR：平均修理時間</text><rect x="90" y="480" width="780" height="110" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="108" y="514" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">稼働率＝MTBF ÷ (MTBF＋MTTR)</text><text x="108" y="548" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">予防保守 → 故障を抑える → MTBFが長くなる</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">改善したい方向はMTBFを長く、MTTRを短く。</text></g></svg>