<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title48 desc48"><title id="title48">問48 共通フレームの要件定義</title><desc id="desc48">共通フレームの要件定義を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問48 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">共通フレームの要件定義</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="55" y="165" width="390" height="165" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="73" y="199" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">利害関係者</text><text x="73" y="233" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">利用者：予約したい／職員：貸出を管理</text><text x="73" y="260" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">したい</text><rect x="515" y="165" width="390" height="165" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="533" y="199" font-size="22" fill="#16324f" font-weight="700" text-anchor="start">制約条件</text><text x="533" y="233" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">予算・期限／利用できる端末・環境</text><line x1="250" y1="335" x2="405" y2="445" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow48)"/><line x1="710" y1="335" x2="555" y2="445" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow48)"/><rect x="175" y="455" width="610" height="120" rx="12" fill="#e4f5ed" stroke="#bfd0df"/><text x="193" y="489" font-size="22" fill="#087d64" font-weight="700" text-anchor="start">要件を定義</text><text x="193" y="523" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">誰の何のニーズを満たすか明らかにする</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">「何が必要か」を定義してから「どう実現するか」という方式へ進む。</text></g></svg>