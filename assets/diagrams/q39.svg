<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title39 desc39"><title id="title39">問39 スクラムイベントの順序</title><desc id="desc39">スクラムイベントの順序を問題の条件と説明用の例で整理する学習図</desc><defs><marker id="arrow39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker></defs><rect width="960" height="720" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="36" y="36" font-size="17" fill="#2872ae" font-weight="400" text-anchor="start">問39 ／ 2025.12.14 FE修了試験</text><text x="36" y="88" font-size="29" fill="#16324f" font-weight="700" text-anchor="start">スクラムイベントの順序</text><line x1="36" y1="112" x2="924" y2="112" stroke="#bfd0df" stroke-width="2"/><rect x="50.0" y="230" width="197.0" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="68.0" y="264" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">1 計画</text><text x="68.0" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">スプリントプラン</text><text x="68.0" y="325" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">ニング</text><line x1="249.0" y1="310" x2="267.0" y2="310" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow39)"/><rect x="271.0" y="230" width="197.0" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="289.0" y="264" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">4 日次確認</text><text x="289.0" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">デイリースクラム</text><line x1="470.0" y1="310" x2="488.0" y2="310" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow39)"/><rect x="492.0" y="230" width="197.0" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="510.0" y="264" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">3 成果確認</text><text x="510.0" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">スプリントレビュ</text><text x="510.0" y="325" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">ー</text><line x1="691.0" y1="310" x2="709.0" y2="310" stroke="#2872ae" stroke-width="3" marker-end="url(#arrow39)"/><rect x="713.0" y="230" width="197.0" height="160" rx="12" fill="#e8f1fa" stroke="#bfd0df"/><text x="731.0" y="264" font-size="20" fill="#16324f" font-weight="700" text-anchor="start">2 振返り</text><text x="731.0" y="298" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">レトロスペクティ</text><text x="731.0" y="325" font-size="18" fill="#16324f" font-weight="400" text-anchor="start">ブ</text><text x="105" y="495" font-size="21" fill="#16324f" font-weight="400" text-anchor="start">何を目指す？ → 日々の適応 → 何ができた？ → どう改善する？</text><rect x="36" y="637" width="888" height="60" rx="12" fill="#e4f5ed" stroke="none"/><text x="53" y="662" font-size="17" fill="#087d64" font-weight="400" text-anchor="start">成果のレビューと、プロセスの振返りを区別する。順序は1→4→3→2。</text></g></svg>